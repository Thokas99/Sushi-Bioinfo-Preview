name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned JavaScript build and parser dependencies
        run: npm ci
      - name: Install GTK smoke-test dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gjs gir1.2-gtk-3.0 gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
      - name: Run tests and reproducibility checks
        env:
          SUSHI_GTK_SMOKE_REQUIRED: '1'
        run: npm test
